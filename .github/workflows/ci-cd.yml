name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TERRAFORM_VERSION: 1.7.5
  NODE_VERSION: '20'
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
  ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
  AB_TRAFFIC_WEIGHT: '0.5'

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lambda dependencies + tests
        working-directory: lambda
        run: |
          npm ci || npm install
          npm test

      - name: Frontend dependencies + tests
        working-directory: frontend
        run: |
          npm ci || npm install
          npm test

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: tfsec (Terraform static analysis)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

      - name: Checkov (IaC misconfiguration scan)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          soft_fail: true
          quiet: true

      - name: npm audit (lambda)
        working-directory: lambda
        run: |
          npm ci || npm install
          npm audit --audit-level=high || true

      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          npm ci || npm install
          npm audit --audit-level=high || true

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    env:
      TF_VAR_supabase_url: ${{ env.SUPABASE_URL }}
      TF_VAR_supabase_key: ${{ env.SUPABASE_KEY }}
      TF_VAR_jwt_secret: ${{ env.JWT_SECRET }}
      TF_VAR_admin_username: ${{ env.ADMIN_USERNAME }}
      TF_VAR_admin_password_hash: ${{ env.ADMIN_PASSWORD_HASH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            lambda/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Install Lambda dependencies
        working-directory: lambda
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Terraform init
        working-directory: terraform
        # FIX: the state bucket/lock table used to be hardcoded in
        # backend.tf, leaking a real AWS account id in a public repo. They
        # are now passed in here via -backend-config, sourced from GitHub
        # secrets, and never committed anywhere.
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan

      - name: Capture current Lambda alias versions
        id: snapshot-aliases
        run: |
          set -euo pipefail
          mkdir -p artifacts
          FUNCTION_NAME="TransactionSimulatorAPI"
          LIVE_VERSION=$(aws lambda get-alias --function-name "$FUNCTION_NAME" --name LIVE --query 'FunctionVersion' --output text 2>/dev/null || true)
          BETA_VERSION=$(aws lambda get-alias --function-name "$FUNCTION_NAME" --name BETA --query 'FunctionVersion' --output text 2>/dev/null || true)
          cat <<JSON > artifacts/lambda_alias_versions.json
          {
            "function_name": "$FUNCTION_NAME",
            "live_version": "${LIVE_VERSION:-}",
            "beta_version": "${BETA_VERSION:-}"
          }
          JSON

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan

      - name: Upload alias snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-alias-snapshot
          path: artifacts/lambda_alias_versions.json

  manual-approval:
    name: Await Manual Approval
    runs-on: ubuntu-latest
    needs: [terraform-plan, test, security-scan]
    environment:
      name: production
    steps:
      - name: Approval required
        run: echo "Approve this job in the production environment to continue."

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: manual-approval
    env:
      TF_VAR_supabase_url: ${{ env.SUPABASE_URL }}
      TF_VAR_supabase_key: ${{ env.SUPABASE_KEY }}
      TF_VAR_jwt_secret: ${{ env.JWT_SECRET }}
      TF_VAR_admin_username: ${{ env.ADMIN_USERNAME }}
      TF_VAR_admin_password_hash: ${{ env.ADMIN_PASSWORD_HASH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            lambda/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Install Lambda dependencies
        working-directory: lambda
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve

      - name: Capture Terraform outputs
        working-directory: terraform
        run: terraform output -json > ../terraform_outputs.json

      - name: Invalidate CloudFront cache
        working-directory: terraform
        run: |
          set -euo pipefail
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          echo "Invalidating CloudFront distribution $DIST_ID"
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"

      - name: Upload Terraform outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: terraform_outputs.json

  pre-traffic-validation:
    name: Validate New Version (BETA, no real traffic)
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      # FIX: previously, traffic was shifted onto the new Lambda version
      # (lambda-ab-test, below) BEFORE any smoke test ran against it — so a
      # broken deploy would already be serving ~50% of real users by the
      # time a problem was detected. This job invokes the BETA alias
      # directly (bypassing API Gateway and any real users entirely) and
      # only lets the pipeline proceed to shift real traffic if the new
      # code behaves correctly in isolation.
      - name: Invoke BETA alias directly and check responses
        run: |
          set -euo pipefail
          FUNCTION_NAME="TransactionSimulatorAPI"

          invoke() {
            aws lambda invoke \
              --function-name "$FUNCTION_NAME:BETA" \
              --cli-binary-format raw-in-base64-out \
              --payload "$1" \
              /tmp/response.json > /dev/null
            cat /tmp/response.json
          }

          echo "Checking invalid login is rejected with 401..."
          RESP=$(invoke '{"httpMethod":"POST","path":"/api/login","headers":{},"body":"{\"username\":\"admin\",\"password\":\"definitely-wrong\"}"}')
          STATUS=$(echo "$RESP" | jq -r '.statusCode')
          if [ "$STATUS" != "401" ]; then
            echo "Expected 401 for invalid login, got $STATUS: $RESP" >&2
            exit 1
          fi

          echo "Checking protected route rejects an unauthenticated request..."
          RESP=$(invoke '{"httpMethod":"GET","path":"/api/transactions","headers":{}}')
          # The BETA alias is invoked directly (bypassing the API Gateway
          # authorizer), so the Lambda itself returns 200 here; what we're
          # really confirming is that the deployed code path executes
          # without error. Real auth enforcement is re-checked against the
          # live API Gateway endpoint in the smoke-tests job below.
          STATUS=$(echo "$RESP" | jq -r '.statusCode')
          if [ "$STATUS" != "200" ]; then
            echo "New version errored on a basic request: $RESP" >&2
            exit 1
          fi

          echo "New Lambda version passed pre-traffic validation."

  lambda-ab-test:
    name: Shift Canary Traffic to New Version
    runs-on: ubuntu-latest
    needs: pre-traffic-validation
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs
          path: artifacts

      - name: Download alias snapshot
        uses: actions/download-artifact@v4
        with:
          name: pre-deploy-alias-snapshot
          path: artifacts

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Configure traffic weights
        id: shift
        env:
          ROUTING_WEIGHT: ${{ env.AB_TRAFFIC_WEIGHT }}
        run: |
          set -euo pipefail
          SNAPSHOT_FILE="artifacts/lambda_alias_versions.json"
          OUTPUT_FILE="artifacts/terraform_outputs.json"

          FUNCTION_NAME=$(jq -r '.lambda_function_name.value // ""' "$OUTPUT_FILE")
          if [ -z "$FUNCTION_NAME" ] || [ "$FUNCTION_NAME" = "null" ]; then
            echo "Unable to determine Lambda function name; aborting." >&2
            exit 1
          fi

          NEW_VERSION=$(aws lambda get-alias --function-name "$FUNCTION_NAME" --name BETA --query 'FunctionVersion' --output text)
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "function_name=$FUNCTION_NAME" >> "$GITHUB_OUTPUT"

          PREVIOUS_VERSION=$(jq -r '.live_version // ""' "$SNAPSHOT_FILE")

          if [ -z "$PREVIOUS_VERSION" ] || [ "$PREVIOUS_VERSION" = "None" ] || [ "$PREVIOUS_VERSION" = "$NEW_VERSION" ]; then
            echo "No prior LIVE version (first deploy) or nothing changed — promoting $NEW_VERSION to 100% directly, no canary needed."
            aws lambda update-alias \
              --function-name "$FUNCTION_NAME" \
              --name LIVE \
              --function-version "$NEW_VERSION" \
              --routing-config "{}"
            echo "promoted_directly=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "promoted_directly=false" >> "$GITHUB_OUTPUT"
          echo "Routing $(echo "$ROUTING_WEIGHT" | awk '{printf "%s%%", $1*100}') of traffic to version $NEW_VERSION while keeping version $PREVIOUS_VERSION as primary."

          aws lambda update-alias \
            --function-name "$FUNCTION_NAME" \
            --name LIVE \
            --function-version "$PREVIOUS_VERSION" \
            --routing-config "AdditionalVersionWeights={\"$NEW_VERSION\"=$ROUTING_WEIGHT}"
    outputs:
      new_version: ${{ steps.shift.outputs.new_version }}
      function_name: ${{ steps.shift.outputs.function_name }}
      promoted_directly: ${{ steps.shift.outputs.promoted_directly }}

  smoke-tests:
    name: Smoke Tests (against live canary traffic)
    runs-on: ubuntu-latest
    needs: lambda-ab-test
    steps:
      - name: Download Terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs
          path: artifacts

      - name: Install curl and jq
        run: sudo apt-get update -y && sudo apt-get install -y curl jq

      - name: Run smoke tests
        env:
          TERRAFORM_OUTPUTS: artifacts/terraform_outputs.json
        run: |
          set -euo pipefail
          API_URL=$(jq -r '.api_gateway_invoke_url.value // ""' "$TERRAFORM_OUTPUTS")
          FRONTEND_URL=$(jq -r '.frontend_url.value // ""' "$TERRAFORM_OUTPUTS")

          if [ -z "$API_URL" ] || [ "$API_URL" = "null" ]; then
            echo "ERROR: API_URL is empty." >&2
            exit 1
          fi
          if [ -z "$FRONTEND_URL" ] || [ "$FRONTEND_URL" = "null" ]; then
            echo "ERROR: FRONTEND_URL is empty." >&2
            exit 1
          fi

          LOGIN_ENDPOINT="${API_URL%/}/api/login"

          # FIX: this used to POST a real, hardcoded admin password
          # ("password123") to the live login endpoint — which meant the
          # actual production admin password had to literally be
          # "password123" for CI to pass, permanently defeating the bcrypt
          # hashing this project otherwise relies on, and exposing the real
          # credential to anyone reading this public workflow file.
          #
          # Instead we only assert the *shape* of auth behaviour, using
          # credentials that are guaranteed wrong: a malformed request
          # returns 400, and a wrong password returns 401. Neither requires
          # knowing (or committing) the real admin password.
          echo "Testing that a malformed login request is rejected (400)..."
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "$LOGIN_ENDPOINT" \
            -H 'Content-Type: application/json' \
            -d '{}')
          if [ "$STATUS" != "400" ]; then
            echo "Expected 400 for a missing username/password, got $STATUS" >&2
            exit 1
          fi

          echo "Testing that a wrong password is rejected (401)..."
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "$LOGIN_ENDPOINT" \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"definitely-not-the-real-password"}')
          if [ "$STATUS" != "401" ]; then
            echo "Expected 401 for a wrong password, got $STATUS" >&2
            exit 1
          fi

          echo "Verifying protected route rejects unauthenticated requests..."
          PROTECTED_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X GET "${API_URL%/}/api/transactions")
          if [ "$PROTECTED_STATUS" != "401" ] && [ "$PROTECTED_STATUS" != "403" ]; then
            echo "Protected route was reachable without a token (status $PROTECTED_STATUS)" >&2
            exit 1
          fi
          echo "Protected route correctly returned $PROTECTED_STATUS without a token."

          echo "Testing frontend availability at $FRONTEND_URL"
          FRONTEND_STATUS=$(curl -sS -o frontend_response.html -w '%{http_code}' "$FRONTEND_URL")
          if [ "$FRONTEND_STATUS" -ge 400 ]; then
            echo "Frontend returned status $FRONTEND_STATUS" >&2
            cat frontend_response.html >&2 || true
            exit 1
          fi
          grep -q "Payment" frontend_response.html

          echo "Smoke tests completed successfully."

  promote-canary:
    name: Analyze Canary, then Promote (or Roll Back)
    runs-on: ubuntu-latest
    needs: [lambda-ab-test, smoke-tests]
    if: needs.lambda-ab-test.outputs.promoted_directly != 'true'
    env:
      # Bake window (seconds) the analysis script waits before reading metrics.
      # Kept modest for CI; raise for a firmer signal in a real environment.
      BAKE_SECONDS: '120'
      ERROR_RATE_THRESHOLD: '0.05'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download alias snapshot
        uses: actions/download-artifact@v4
        with:
          name: pre-deploy-alias-snapshot
          path: artifacts

      - name: Record previous LIVE version (for rollback)
        id: prev
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y jq
          PREV=$(jq -r '.live_version // ""' artifacts/lambda_alias_versions.json)
          echo "previous_version=$PREV" >> "$GITHUB_OUTPUT"

      # METRIC-DRIVEN CANARY ANALYSIS (Round 2): smoke-tests already proved the
      # canary slice responds correctly; this step now additionally bakes and
      # compares the new version's real CloudWatch error rate against a
      # threshold before we promote. If it breaches, the next step rolls back.
      - name: Analyze canary error rate
        run: |
          chmod +x scripts/canary_analysis.sh
          FUNCTION_NAME="${{ needs.lambda-ab-test.outputs.function_name }}" \
          NEW_VERSION="${{ needs.lambda-ab-test.outputs.new_version }}" \
          BAKE_SECONDS="${BAKE_SECONDS}" \
          ERROR_RATE_THRESHOLD="${ERROR_RATE_THRESHOLD}" \
          scripts/canary_analysis.sh

      # Runs ONLY if the analysis step above failed: shift 100% of LIVE traffic
      # back to the previous known-good version and clear the routing config,
      # then let the job fail so the pipeline stops red.
      - name: Roll back to previous version (on unhealthy canary)
        if: failure()
        run: |
          set -euo pipefail
          PREV="${{ steps.prev.outputs.previous_version }}"
          FUNCTION_NAME="${{ needs.lambda-ab-test.outputs.function_name }}"
          if [ -z "$PREV" ] || [ "$PREV" = "None" ]; then
            echo "No previous version recorded; cannot auto-roll-back. Investigate manually." >&2
            exit 1
          fi
          echo "Rolling LIVE back to previous version $PREV and clearing canary weights."
          aws lambda update-alias \
            --function-name "$FUNCTION_NAME" \
            --name LIVE \
            --function-version "$PREV" \
            --routing-config "{}"
          echo "Rollback complete. LIVE is back on version $PREV."

      # Reached only when analysis passed: complete the blue/green cycle.
      - name: Promote new version to 100% of LIVE traffic
        run: |
          set -euo pipefail
          aws lambda update-alias \
            --function-name "${{ needs.lambda-ab-test.outputs.function_name }}" \
            --name LIVE \
            --function-version "${{ needs.lambda-ab-test.outputs.new_version }}" \
            --routing-config "{}"
          echo "LIVE now points 100% at version ${{ needs.lambda-ab-test.outputs.new_version }}."
